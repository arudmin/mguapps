name: Chrome Dino CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/chrome_dino/**'
      - '.github/workflows/chrome-dino-vendor.yml'
  pull_request:
    paths:
      - 'apps/chrome_dino/**'
      - '.github/workflows/chrome-dino-vendor.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check apps/chrome_dino/build.js
          node --check apps/chrome_dino/package/javascript/app.js
          node --check apps/chrome_dino/package/javascript/src/i18n.js
          node --check apps/chrome_dino/package/javascript/src/game.js
          node --check apps/chrome_dino/package/javascript/src/render.js
      - name: Test and verify OAP package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            node apps/chrome_dino/tests/test_game.js
            node apps/chrome_dino/tests/test_package.js
            node apps/chrome_dino/tests/test_version.js
            node apps/chrome_dino/tests/test_148.js
            node apps/chrome_dino/tests/test_149.js
            node apps/chrome_dino/tests/test_1411.js
            node apps/chrome_dino/tests/test_1410.js
            node apps/chrome_dino/build.js --preview-only
            node apps/chrome_dino/build.js
            VERSION="$(node -p "require('./apps/chrome_dino/app.json').version")"
            PACKAGE="apps/chrome_dino/dist/chrome_dino@${VERSION}.tgz"
            echo "Validating ${PACKAGE}"
            test -s "${PACKAGE}"
            tar -tzf "${PACKAGE}" > ci-logs/package-contents.txt
            sed -n '1,30p' ci-logs/package-contents.txt
          } 2>&1 | tee ci-logs/chrome-dino-build.log
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-dino-diagnostics
          path: ci-logs/
          if-no-files-found: warn
