name: Chrome Dino Leaderboard Staging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/chrome_dino/leaderboard/**'
      - '.github/workflows/chrome-dino-leaderboard.yml'
permissions:
  contents: read
concurrency:
  group: chrome-dino-leaderboard-staging
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Server tests
        working-directory: apps/chrome_dino/leaderboard/worker
        run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/chrome_dino/leaderboard/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REQUIRE_EXISTING_RESOURCES: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify credentials and provision free-tier resources
        run: node scripts/provision.mjs
      - name: Apply schema and deploy staging Worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply chrome-dino-leaderboard-staging --remote
          if [ -f .deploy-secrets.json ]; then
            npx --yes wrangler@4 deploy --secrets-file .deploy-secrets.json
          else
            npx --yes wrangler@4 deploy
          fi
      - name: Verify deployed health and all four leaderboards
        run: |
          set -euo pipefail
          BASE="$(cat .deploy-url)"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 "$BASE/health" | tee /tmp/dino-health.json
          node -e "const x=require('/tmp/dino-health.json');if(!x.ok||x.version!=='0.2.13'||x.verification!=='pending_only')process.exit(1)"
          curl -fsS "$BASE/v1/leaderboard" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const j=JSON.parse(s);if(Object.keys(j.boards).length!==4)process.exit(1)})'
          node scripts/check-recovery.mjs "$BASE"
          echo "Staging endpoint: $BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete transient secret files
        if: always()
        run: rm -f .deploy-secrets.json .deploy-url wrangler.toml

  release:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and publish the tagged Store package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/chrome_dino/app.json').version")"
          TAG="chrome-dino-v$VERSION"
          for test in apps/chrome_dino/tests/test_*.js; do node "$test"; done
          node apps/chrome_dino/build.js --preview-only
          node apps/chrome_dino/build.js
          PACKAGE="apps/chrome_dino/dist/chrome_dino@${VERSION}.tgz"
          tar -tzf "$PACKAGE" > /dev/null
          sha256sum "$PACKAGE"
          if ! git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null; then
            git push origin "$GITHUB_SHA:refs/tags/$TAG"
          fi
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD:apps/chrome_dino/package')" = "$(git rev-parse 'HEAD:apps/chrome_dino/package')"
          bash apps/chrome_dino/scripts/publish-package.sh "$PACKAGE"
          echo "Published $TAG and its Store package on the public chrome-dino-packages branch." >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the package to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/chrome_dino/app.json').version")"
          TAG="chrome-dino-v$VERSION"
          PACKAGE="apps/chrome_dino/dist/chrome_dino-$VERSION.tgz"
          cp "apps/chrome_dino/dist/chrome_dino@$VERSION.tgz" "$PACKAGE"
          for delay in 1 3 6; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id >/dev/null ||
              gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
                -f tag_name="$TAG" -f name="Chrome Dino $VERSION" -F body=@apps/chrome_dino/RELEASE-NOTES.md \
                -F draft=false -F prerelease=false --jq .id >/dev/null; then
              if gh release upload "$TAG" "$PACKAGE" --clobber; then exit 0; fi
            fi
            sleep "$delay"
          done
          echo "::warning::GitHub Releases API failed. The source tag and public Store package were published."
