name: Leaderboard D1 integration check
on:
  workflow_dispatch:
  push:
    branches: [top-chart]
    paths: ['.github/workflows/leaderboard-d1-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check real staging API and D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/chrome_dino/leaderboard/worker/scripts/check-d1.mjs
